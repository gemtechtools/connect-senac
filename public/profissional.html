<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect Senac - Painel do Docente</title>
  <meta name="description"
    content="Painel do Docente — gerencie as suas turmas e a presença dos modelos no Connect Senac.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
</head>

<body class="app-body">

  <!-- ========== SIDEBAR ========== -->
  <aside class="app-sidebar" id="appSidebar">
    <div class="sidebar-header">
      <a class="sidebar-brand" href="#">
        <span class="sidebar-brand-mark">CS</span>
        Connect Senac
      </a>
      <button class="sidebar-close-btn" id="sidebarClose" aria-label="Fechar menu">✕</button>
    </div>

    <nav class="sidebar-nav" aria-label="Navegação do docente">
      <span class="sidebar-nav-label">Menu</span>
      <a href="#" class="sidebar-link active">
        <span class="link-icon">👨‍🏫</span> Minhas Turmas
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-avatar">P</div>
        <div class="sidebar-user-info">
          <span class="sidebar-user-name" id="nomeProf">--</span>
          <span class="sidebar-user-role">Área do Professor</span>
        </div>
      </div>
      <button class="btn-sidebar-sair" id="btnSair">
        <span>↩</span> Sair da conta
      </button>
    </div>
  </aside>

  <!-- Overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ========== CONTEÚDO PRINCIPAL ========== -->
  <div class="app-content">

    <!-- Top Bar (mobile only) -->
    <header class="app-topbar">
      <button class="sidebar-toggle-btn" id="sidebarToggle" aria-label="Abrir menu">☰</button>
      <span class="topbar-brand">Connect Senac</span>
      <div class="topbar-right">
        <span class="badge"
          style="background: var(--cs-brand-light); color: var(--cs-brand); font-weight: 600; font-size: 0.72rem;">Área
          do Professor</span>
      </div>
    </header>

    <main class="app-main">
      <h4 class="section-title">👨‍🏫 As Minhas Turmas e Listas de Modelos</h4>

      <div class="accordion shadow-sm" id="accordionTurmas">
        <div class="text-center text-muted p-5">
          A carregar a pauta de presenças...
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // ===== LÓGICA DO PAINEL DO PROFESSOR (preservada) =====
    const API_URL =
      window.location.protocol === "file:"
        ? "http://localhost:3000/api"
        : `${window.location.origin}/api`;
    const token = localStorage.getItem("token");

    if (!token) window.location.href = "index.html";

    const payloadToken = JSON.parse(atob(token.split(".")[1]));
    document.getElementById("nomeProf").textContent =
      payloadToken.email.split("@")[0];

    document.getElementById("btnSair").addEventListener("click", () => {
      localStorage.removeItem("token");
      window.location.href = "index.html";
    });

    async function carregarMinhasTurmas() {
      const accordion = document.getElementById("accordionTurmas");
      try {
        const response = await fetch(
          `${API_URL}/profissional/minhas-turmas`,
          {
            headers: { Authorization: `Bearer ${token}` },
          },
        );

        const cursos = await response.json();
        accordion.innerHTML = "";

        if (cursos.length === 0) {
          accordion.innerHTML =
            '<div class="alert alert-info border-0 shadow-sm">Nenhum curso ativo vinculado ao seu perfil de momento.</div>';
          return;
        }

        cursos.forEach((curso, index) => {
          let horariosHTML = "";

          // Ordenar as disponibilidades por data no Front-end por garantia
          curso.disponibilidades.sort(
            (a, b) => new Date(a.data_hora) - new Date(b.data_hora),
          );

          curso.disponibilidades.forEach((disp) => {
            const dataFormatada = new Date(disp.data_hora).toLocaleString(
              "pt-BR",
              { dateStyle: "short", timeStyle: "short" },
            );

            // Filtrar agendamentos que não foram cancelados
            const agendamentosAtivos = disp.agendamentos.filter(
              (a) => a.status !== "cancelado",
            );

            let tabelaModelos = "";
            if (agendamentosAtivos.length === 0) {
              tabelaModelos = `<p class="text-muted small mb-0 mt-2">Nenhum modelo agendado para este horário ainda.</p>`;
            } else {
              // Lógica para mostrar o botão ou apenas o selo
              let linhas = agendamentosAtivos
                .map((ag) => {
                  let acoesHTML = '';
                  if (ag.status === 'agendado') {
                    acoesHTML = `
                  <div class="d-flex gap-1">
                    <button class="btn btn-sm btn-outline-success fw-bold w-100" onclick="concluirServico('${ag.id}')" title="Confirmar Presença">✅</button>
                     <button class="btn btn-sm btn-outline-danger fw-bold w-100" onclick="cancelarAluno('${ag.id}', '${ag.usuarios.nome}')" title="Cancelar / Falta">❌</button>
                  </div>
                 `;
                  } else {
                    acoesHTML = `<span class="badge w-100 py-2 ${ag.status === 'concluido' ? 'bg-success' : 'bg-secondary'}">${ag.status.toUpperCase()}</span>`;
                  }

                  const msgProf = encodeURIComponent(`Olá, ${ag.usuarios.nome}! Aqui é o Prof. ${payloadToken.email.split('@')[0]} do curso de ${curso.nome} do SENAC.`);

                  return `
                                <tr>
                                    <td class="align-middle">${ag.usuarios.nome}</td>
                                    <td class="align-middle">${ag.usuarios.email}</td>
                                    <td class="align-middle">
                                        <a href="https://wa.me/55${ag.usuarios.telefone.replace(/\D/g, '')}?text=${msgProf}" target="_blank" class="btn btn-sm btn-outline-success border-0">
                                            <i class="bi bi-whatsapp"></i> 📱 Falar no WhatsApp
                                        </a>
                                    </td>
                                    <td class="align-middle" style="width: 150px;">${acoesHTML}</td>
                                </tr>
                                `;
                })
                .join("");

              tabelaModelos = `
                                <table class="table table-sm mt-3 border">
                                    <thead class="table-light"><tr><th>Modelo</th><th>Email</th><th>Contacto</th><th>Status</th></tr></thead>
                                    <tbody>${linhas}</tbody>
                                </table>`;
            }

            horariosHTML += `
                            <div class="mb-4 p-3 bg-white border rounded">
                                <div class="fw-bold text-dark border-bottom pb-2">📅 Aula: ${dataFormatada} <span class="badge bg-secondary float-end">Ocupação: ${disp.vagas_ocupadas} / ${disp.vagas_totais}</span></div>
                                ${tabelaModelos}
                            </div>
                        `;
          });

          const itemOpen = index === 0 ? "show" : "";
          const btnCollapsed = index === 0 ? "" : "collapsed";

          accordion.innerHTML += `
                        <div class="accordion-item border-0 border-bottom">
                            <h2 class="accordion-header">
                                <button class="accordion-button ${btnCollapsed}" type="button" data-bs-toggle="collapse" data-bs-target="#collapse${curso.id}">
                                    📘 ${curso.nome}
                                </button>
                            </h2>
                            <div id="collapse${curso.id}" class="accordion-collapse collapse ${itemOpen}" data-bs-parent="#accordionTurmas">
                                <div class="accordion-body bg-light">
                                    ${horariosHTML || '<p class="text-muted">Sem horários abertos para este curso.</p>'}
                                </div>
                            </div>
                        </div>
                    `;
        });
      } catch (error) {
        accordion.innerHTML =
          '<div class="text-danger p-4">Erro ao carregar os dados.</div>';
      }
    }

    carregarMinhasTurmas();

    // Função ativada pelo clique do professor
    async function concluirServico(agendamentoId) {
      if (
        !confirm("O modelo compareceu e o serviço foi realizado com sucesso?")
      )
        return;

      try {
        const response = await fetch(
          `${API_URL}/profissional/agendamentos/${agendamentoId}/concluir`,
          {
            method: "PUT",
            headers: { Authorization: `Bearer ${token}` },
          },
        );

        if (response.ok) {
          carregarMinhasTurmas(); // Recarrega a tabela instantaneamente
        } else {
          const data = await response.json();
          alert(data.erro);
        }
      } catch (error) {
        alert("Erro ao ligar ao servidor.");
      }
    }
    async function cancelarAluno(agendamentoId, nome) {
      if (!confirm(`Deseja remover ${nome} da pauta? A vaga será reaberta para outro modelo.`)) return;
      try {
        const response = await fetch(`${API_URL}/profissional/agendamentos/${agendamentoId}/cancelar`, {
          method: 'PUT',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (response.ok) carregarMinhasTurmas();
        else alert((await response.json()).erro);
      } catch (error) { alert('Erro na conexão.'); }
    }

    // ===== SIDEBAR TOGGLE (mobile) =====
    const appSidebar = document.getElementById('appSidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    const sidebarToggle = document.getElementById('sidebarToggle');
    const sidebarClose = document.getElementById('sidebarClose');

    function openSidebar() { appSidebar.classList.add('is-open'); sidebarOverlay.classList.add('is-open'); }
    function closeSidebar() { appSidebar.classList.remove('is-open'); sidebarOverlay.classList.remove('is-open'); }

    sidebarToggle?.addEventListener('click', openSidebar);
    sidebarClose?.addEventListener('click', closeSidebar);
    sidebarOverlay?.addEventListener('click', closeSidebar);
  </script>
</body>

</html>
